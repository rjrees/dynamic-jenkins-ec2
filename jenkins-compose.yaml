services:
  # Init container: prepares truststore with custom CA certificates  # Main Jenkins container
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: on-failure
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - $(pwd)/jenkins/jenkins_home:/var/jenkins_home
      #- jenkins-cacerts:/cacerts:ro
    environment:
      JAVA_OPTS: "-Djavax.net.ssl.trustStore=/cacerts/cacerts -Djavax.net.ssl.trustStorePassword=changeit"

volumes:
  jenkins_home:
  #jenkins-cacerts: